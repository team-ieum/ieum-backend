services:
  postgres:
    image: postgres:16
    container_name: ieum-postgres
    environment:
      POSTGRES_DB: ieum
      POSTGRES_USER: ieum
      POSTGRES_PASSWORD: ieum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ieum-redis
    ports:
      - "127.0.0.1:6379:6379"

  mongodb:
    image: mongo:7
    container_name: ieum-mongo
    environment:
      MONGO_INITDB_DATABASE: ieum
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  postgres-data:
  mongo-data:

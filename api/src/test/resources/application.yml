spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  servlet:
    multipart:
      # 접근 시점에 파싱한다 — 기본(즉시)이면 DispatcherServlet이 multipart 본문을 먼저 소비해
      # /api/v1/hooks/{token} 리더가 빈 본문을 받고 5MB 상한도 우회된다(IEUM-BE-91)
      resolve-lazily: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

  # JavaMailSender 빈 생성용. 빈 생성 시점엔 SMTP에 접속하지 않는다.
  mail:
    host: localhost

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: "{baseUrl}/api/v1/auth/{registrationId}/callback"
            scope: email, profile

oauth2:
  redirect-uri: http://localhost:3000/oauth2/callback

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-minimum
  expiration: 86400000
  refresh-expiration: 604800000

aes:
  secret-key: test-aes-key-32bytes-padding!!!!

ieum:
  deployment:
    mode-guard:
      # These standalone context fixtures deliberately have no Redis. The guard's
      # production fail-closed behavior is covered by DeploymentModeGuardTest.
      enabled: false
  agent:
    url: http://localhost:8000
  trigger:
    gmail:
      # 캐시된 컨텍스트가 테스트 내내 살아 있다 — 스윕이 공유 H2의 다른 테스트 행을 리스하지 않게 사실상 끈다.
      sweep-initial-delay: P1D
  catalog:
    # 테스트엔 agent가 없다 — 기동 때 agent 카탈로그 대조(AgentCatalogDiffReporter)를 끈다.
    agent-diff-check: false

notion:
  oauth:
    auth-url: https://api.notion.com/v1/oauth/authorize
    token-url: https://api.notion.com/v1/oauth/token
    client-id: test-notion-client-id
    client-secret: test-notion-client-secret
    redirect-uri: http://localhost/api/v1/notion/oauth2/callback
    frontend-redirect-uri: http://localhost/settings

github:
  app:
    client-id: test-github-client-id
    client-secret: test-github-client-secret
    token-url: https://github.com/login/oauth/access_token
    redirect-uri: http://localhost/api/v1/github/oauth2/callback
    frontend-redirect-uri: http://localhost/settings/integrations
    webhook-secret: test-github-webhook-secret
    slug: test-app

management:
  health:
    redis:
      enabled: false
    mongo:
      enabled: false

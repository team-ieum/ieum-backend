spring:
  application:
    name: ieum-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
    mongodb:
      uri: ${MONGO_URI}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/v1/oauth2/callback/{registrationId}"
            # baseline scope만 등록 — 그 외 scope는 google.oauth.scopes 기반으로
            # IncrementalScopeAuthorizationRequestResolver가 scope_groups 파라미터로 동적 주입
            scope: email, profile
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

aes:
  secret-key: ${AES_SECRET_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: db, mongo, redis

ieum:
  agent:
    url: ${AGENT_SERVICE_URL}
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:180}
  scheduler:
    thread-count: ${QUARTZ_THREAD_COUNT:10}
    thread-name-prefix: ${QUARTZ_THREAD_NAME_PREFIX:quartz-}

notion:
  oauth:
    client-id: ${NOTION_CLIENT_ID}
    client-secret: ${NOTION_CLIENT_SECRET}
    auth-url: ${NOTION_AUTH_URL}
    token-url: ${NOTION_TOKEN_URL}
    redirect-uri: ${NOTION_REDIRECT_URI}
    frontend-redirect-uri: ${NOTION_FRONTEND_REDIRECT_URI}

github:
  app:
    client-id: ${GITHUB_APP_CLIENT_ID}
    client-secret: ${GITHUB_APP_CLIENT_SECRET}
    token-url: ${GITHUB_APP_TOKEN_URL}
    redirect-uri: ${GITHUB_APP_REDIRECT_URI}
    frontend-redirect-uri: ${GITHUB_APP_FRONTEND_REDIRECT_URI}
    webhook-secret: ${GITHUB_APP_WEBHOOK_SECRET}

google:
  oauth:
    incremental-auth: ${GOOGLE_OAUTH_INCREMENTAL_AUTH:true}
    scopes:
      gmail:
        - https://www.googleapis.com/auth/gmail.modify
      sheets:
        - https://www.googleapis.com/auth/spreadsheets
      drive:
        - https://www.googleapis.com/auth/drive
      calendar:
        - https://www.googleapis.com/auth/calendar

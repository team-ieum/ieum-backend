spring:
  application:
    name: ieum-backend

  mvc:
    async:
      # SSE(워크플로우 실행 진행 스트림) 등 비동기 요청의 최대 유지 시간(ms).
      # 실행이 끝나면 스트림은 complete()로 즉시 정상 종료되며, 이 값은 실행 스레드가 비정상
      # 종료된 경우의 좀비 연결을 정리하는 안전망이다. 타임아웃으로 끊겨도 프론트는 재연결 시
      # 진행 스냅샷으로 복구된다. (미설정 시 서블릿 컨테이너 기본값이 SSE를 조기 종료할 수 있음)
      request-timeout: ${MVC_ASYNC_TIMEOUT_MS:600000}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # [IEUM-BE-42] 커넥션 풀 고갈 완화. 워크플로 실행 워커(workflowExecutor max 8 ×
      # parallelism 4)와 HTTP API·Quartz·SSE가 단일 풀을 공유하므로, 기본 풀(10)로는
      # 동시 실행 폭을 감당하지 못해 고갈됐다. 동시 워커 상한 대비 여유를 둔다.
      # 운영 시 PostgreSQL max_connections와 backend 인스턴스 수를 고려해 환경변수로 조정.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
    mongodb:
      uri: ${MONGO_URI}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/v1/oauth2/callback/{registrationId}"
            # baseline scope만 등록 — 그 외 scope는 google.oauth.scopes 기반으로
            # IncrementalScopeAuthorizationRequestResolver가 scope_groups 파라미터로 동적 주입
            scope: email, profile
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

aes:
  secret-key: ${AES_SECRET_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: db, mongo, redis

ieum:
  agent:
    url: ${AGENT_SERVICE_URL}
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:180}
  scheduler:
    thread-count: ${QUARTZ_THREAD_COUNT:10}
    thread-name-prefix: ${QUARTZ_THREAD_NAME_PREFIX:quartz-}
  workflow:
    # [IEUM-BE-42] 워크플로 동시 실행 스레드풀. 동시 실행 워크플로 수를 풀(아래 hikari)에
    # 정합시키기 위해 max-pool-size를 8 → 6으로 낮춘다. ThreadPoolTaskExecutor는
    # core-pool-size까지 즉시 실행 후 queue에 적재하므로, 이 값이 동시 실행 게이트 역할을 한다.
    # 피크 커넥션 추산: max-pool(6) × parallelism(3) ≈ 18 노드 워커 + 메인/로그 + HTTP/Quartz
    #                  ≈ 25 < hikari.maximum-pool-size(30).
    executor:
      core-pool-size: ${WORKFLOW_EXECUTOR_CORE_POOL_SIZE:4}
      max-pool-size: ${WORKFLOW_EXECUTOR_MAX_POOL_SIZE:6}
      queue-capacity: ${WORKFLOW_EXECUTOR_QUEUE_CAPACITY:30}

# [IEUM-BE-42] 워크플로 1개 내부에서 동시 실행할 노드 수(fan-out 병렬도).
# 노드당 DB 쿼리(credential·role·token·webhook)를 쏘므로, 4 → 3으로 낮춰 커넥션 압박을 줄인다.
# (워크플로 동시 실행 스레드풀은 ieum.workflow.executor 참고)
workflow:
  execution:
    parallelism: ${WORKFLOW_EXECUTION_PARALLELISM:3}

notion:
  oauth:
    client-id: ${NOTION_CLIENT_ID}
    client-secret: ${NOTION_CLIENT_SECRET}
    auth-url: ${NOTION_AUTH_URL}
    token-url: ${NOTION_TOKEN_URL}
    redirect-uri: ${NOTION_REDIRECT_URI}
    frontend-redirect-uri: ${NOTION_FRONTEND_REDIRECT_URI}

github:
  app:
    client-id: ${GITHUB_APP_CLIENT_ID}
    client-secret: ${GITHUB_APP_CLIENT_SECRET}
    token-url: ${GITHUB_APP_TOKEN_URL}
    redirect-uri: ${GITHUB_APP_REDIRECT_URI}
    frontend-redirect-uri: ${GITHUB_APP_FRONTEND_REDIRECT_URI}
    webhook-secret: ${GITHUB_APP_WEBHOOK_SECRET}

google:
  oauth:
    incremental-auth: ${GOOGLE_OAUTH_INCREMENTAL_AUTH:true}
    scopes:
      gmail:
        - https://www.googleapis.com/auth/gmail.modify
      sheets:
        - https://www.googleapis.com/auth/spreadsheets
      drive:
        - https://www.googleapis.com/auth/drive
      calendar:
        - https://www.googleapis.com/auth/calendar

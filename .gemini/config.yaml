# 스키마: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
# 여기 없는 키는 무시되는 게 아니라 설정 전체를 무효화한다 — 임의 키를 넣지 말 것.
# 리뷰 언어·프로젝트 컨텍스트·중점 항목은 .gemini/styleguide.md가 담는다.

code_review:
  pull_request_opened:
    summary: true

ignore_patterns:
  - "**/gradlew"
  - "**/gradlew.bat"
  - "**/gradle/wrapper/**"

name: Backend Main Blue Green Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, stage private bootstrap inputs, or deploy Main
        type: choice
        required: true
        default: build
        options: [build, stage-bootstrap, deploy]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'backend_main_server' || format('backend_main_build_{0}', github.ref) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/infra/IEUM-BE-123' && inputs.operation == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      image_id: ${{ steps.package.outputs.image_id }}
    env:
      JAVA_VERSION: ${{ secrets.MAIN_COM_JAVA_VERSION }}
      IMAGE_NAME: ${{ secrets.MAIN_COM_IMAGE_NAME }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ieum_ci_test
          POSTGRES_DB: ieum_ci_test
          # Disposable CI database only; this is not an application credential.
          POSTGRES_PASSWORD: ieum_ci_test_only_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ieum_ci_test -d ieum_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Validate Main build settings
        run: python3 scripts/bluegreen/main_image.py validate-build

      - name: Setup Python for deployment tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :api:bootJar -x test --no-daemon

      - name: Test
        env:
          IEUM_TEST_REDIS_HOST: 127.0.0.1
          IEUM_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          IEUM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ieum_ci_test
          IEUM_TEST_POSTGRES_USER: ieum_ci_test
          IEUM_TEST_POSTGRES_PASSWORD: ieum_ci_test_only_password
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/bluegreen -p 'test_*.py'
          ./gradlew test --no-daemon

      - name: Prepare boot jar
        run: |
          mkdir -p .deploy

          BOOT_JAR="$(find api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | head -n 1)"

          if [ -z "$BOOT_JAR" ]; then
            echo "::error::Spring Boot jar file was not found in api/build/libs"
            exit 1
          fi

          cp "$BOOT_JAR" .deploy/app.jar

      - name: Write Main Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          ARG JAVA_MAJOR=21
          FROM eclipse-temurin:${JAVA_MAJOR}-jre
          LABEL ieum.bluegreen.capable="true"
          LABEL ieum.bluegreen.protocol="2"
          WORKDIR /app
          COPY .deploy/app.jar /app/app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          EOF

      - name: Build Main image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f Dockerfile.ci --build-arg JAVA_MAJOR="$BUILD_RUNTIME" \
            -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Package verified Main image
        id: package
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ieum-backend-main-image.XXXXXX")"
          python3 scripts/bluegreen/main_image.py package \
            --file "$directory/image.tar" --image "$IMAGE_NAME:$IMAGE_TAG"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Verify packaged image on GitHub runner
        env:
          IMAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_ID: ${{ steps.package.outputs.image_id }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/main_image.py load \
            --file "$IMAGE_DIRECTORY/image.tar" --image "$IMAGE_NAME:$IMAGE_TAG" \
            --image-id "$IMAGE_ID" --sha256 "$ARCHIVE_SHA256"

      - name: Upload image archive only
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.directory }}/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record immutable build identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_ID: ${{ steps.package.outputs.image_id }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python3 - <<'PYSUMMARY'
          import os
          import re
          values = {key: os.environ[key] for key in ('SOURCE_SHA', 'IMAGE_ID', 'ARCHIVE_SHA256', 'ARTIFACT_ID')}
          for key, pattern in [('SOURCE_SHA', r'[a-f0-9]{40}'), ('IMAGE_ID', r'sha256:[a-f0-9]{64}'),
                               ('ARCHIVE_SHA256', r'[a-f0-9]{64}'), ('ARTIFACT_ID', r'[1-9][0-9]*')]:
              if not re.fullmatch(pattern, values[key]):
                  raise SystemExit('Invalid immutable build metadata')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Verified Main build\n\n| Field | Value |\n|---|---|\n')
              for key, value in values.items():
                  output.write('| ' + key + ' | `' + value + '` |\n')
          PYSUMMARY

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.MAIN_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.operation == 'deploy')
    timeout-minutes: 360
    name: Deploy Main to isolated self-hosted blue-green controller
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-backend, main, deploy]
    env:
      IEUM_DEPLOY_ENVIRONMENT: main
    steps:
      - name: Establish deployment job budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYBUDGET'
          from datetime import datetime, timezone
          import json
          import os
          import time
          import urllib.request

          try:
              # A workflow attempt starts before this job, so queue/setup time reduces the budget too.
              run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              endpoint = (os.environ['GITHUB_API_URL'].rstrip('/') + '/repos/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs/' + run_id + '/attempts/' + attempt)
              request = urllib.request.Request(endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError()
              data = json.loads(raw)
              if str(data['id']) != run_id or str(data['run_attempt']) != attempt:
                  raise ValueError()
              started = datetime.fromisoformat(data['run_started_at'].replace('Z', '+00:00'))
              now = time.time()
              if started.tzinfo is None or started.timestamp() > now:
                  raise ValueError()
              # Leave two minutes before the runner's 360-minute job timeout.
              deadline = int(started.timestamp()) + 360 * 60 - 120
              if deadline - now < 9000:
                  raise ValueError()
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH=' + str(deadline) + '\n')
          except Exception:
              # Never echo the request, token, response or environment.
              raise SystemExit('Unable to establish sufficient deployment job time; retry in a fresh job') from None
          PYBUDGET

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify installed Main controller
        env:
          CONTROLLER_SHA: ${{ vars.MAIN_BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.MAIN_BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure approved Main controller/helper SHA-256 variables"
            exit 1
          fi
          printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen-main/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-main-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1

      - name: Create private image download directory
        id: image_directory
        run: |
          set -euo pipefail
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ieum-backend-main-download.XXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.image_directory.outputs.directory }}
          merge-multiple: true

      - name: Verify archive and loaded image identity
        id: loaded_image
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
          IMAGE_NAME: ${{ secrets.MAIN_COM_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/main_image.py load \
            --file "$IMAGE_DIRECTORY/image.tar" --image "$IMAGE_NAME:$IMAGE_TAG" \
            --image-id "$IMAGE_ID" --sha256 "$ARCHIVE_SHA256"

      - name: Deploy with Main prefixed Secrets
        env:
          IMAGE_ID: ${{ steps.loaded_image.outputs.image_id }}
          IEUM_BACKEND_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          candidate_env="$(mktemp "$RUNNER_TEMP/ieum-backend-main-env.XXXXXX")"
          trap 'rm -f -- "$candidate_env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 scripts/bluegreen/backend_env.py "$candidate_env" --environment main
          unset IEUM_BACKEND_SECRETS_JSON
          python3 /home/kwung/deploy/bluegreen-main/bluegreen.py --lock-timeout 14400 deploy \
            --job-deadline-epoch "$IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH" \
            --service backend --image "$IMAGE_ID" \
            --env-file "$candidate_env" --replace-env

      - name: Remove downloaded image archive
        if: always()
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
        run: |
          python3 - <<'PYCLEAN'
          import os
          from pathlib import Path
          import shutil
          value = os.environ.get('IMAGE_DIRECTORY', '')
          if value:
              directory = Path(value)
              if (directory.parent != Path(os.environ['RUNNER_TEMP'])
                      or not directory.name.startswith('ieum-backend-main-download.')
                      or directory.is_symlink()):
                  raise SystemExit('Invalid Main image cleanup directory')
              shutil.rmtree(directory)
          PYCLEAN

  stage_bootstrap:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-bootstrap' && vars.MAIN_BOOTSTRAP_ENABLED == 'true'
    timeout-minutes: 30
    name: Stage Main bootstrap inputs without starting containers
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-backend, main, deploy]
    env:
      IEUM_DEPLOY_ENVIRONMENT: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify installed Main controller
        env:
          CONTROLLER_SHA: ${{ vars.MAIN_BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.MAIN_BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure approved Main controller/helper SHA-256 variables"
            exit 1
          fi
          printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen-main/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-main-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1

      - name: Create private image download directory
        id: image_directory
        run: |
          set -euo pipefail
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ieum-backend-main-download.XXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.image_directory.outputs.directory }}
          merge-multiple: true

      - name: Verify archive and loaded image identity
        id: loaded_image
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
          IMAGE_NAME: ${{ secrets.MAIN_COM_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/main_image.py load \
            --file "$IMAGE_DIRECTORY/image.tar" --image "$IMAGE_NAME:$IMAGE_TAG" \
            --image-id "$IMAGE_ID" --sha256 "$ARCHIVE_SHA256"

      - name: Stage Main bootstrap settings
        env:
          IMAGE_ID: ${{ steps.loaded_image.outputs.image_id }}
          IEUM_BACKEND_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          candidate_env="$(mktemp "$RUNNER_TEMP/ieum-backend-main-env.XXXXXX")"
          trap 'rm -f -- "$candidate_env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 scripts/bluegreen/backend_env.py "$candidate_env" --environment main
          unset IEUM_BACKEND_SECRETS_JSON
          python3 /home/kwung/deploy/bluegreen-main/bluegreen.py --lock-timeout 30 stage-bootstrap \
            --service backend --image "$IMAGE_ID" \
            --env-file "$candidate_env"

      - name: Remove downloaded image archive
        if: always()
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
        run: |
          python3 - <<'PYCLEAN'
          import os
          from pathlib import Path
          import shutil
          value = os.environ.get('IMAGE_DIRECTORY', '')
          if value:
              directory = Path(value)
              if (directory.parent != Path(os.environ['RUNNER_TEMP'])
                      or not directory.name.startswith('ieum-backend-main-download.')
                      or directory.is_symlink()):
                  raise SystemExit('Invalid Main image cleanup directory')
              shutil.rmtree(directory)
          PYCLEAN

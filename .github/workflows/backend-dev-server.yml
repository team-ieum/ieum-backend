name: Backend Dev Server Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backend_dev_server
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ieum-backend-dev

jobs:
  deploy:
    # Covers bounded cross-repository lock waiting plus this job's build and deployment.
    timeout-minutes: 360
    name: Deploy Dev to Self Hosted Server
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-backend]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ieum_ci_test
          POSTGRES_DB: ieum_ci_test
          # Disposable CI database only; this is not an application credential.
          POSTGRES_PASSWORD: ieum_ci_test_only_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ieum_ci_test -d ieum_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Establish deployment job budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYBUDGET'
          from datetime import datetime, timezone
          import json
          import os
          import time
          import urllib.request

          try:
              # A workflow attempt starts before this job, so queue/setup time reduces the budget too.
              run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              endpoint = (os.environ['GITHUB_API_URL'].rstrip('/') + '/repos/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs/' + run_id + '/attempts/' + attempt)
              request = urllib.request.Request(endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError()
              data = json.loads(raw)
              if str(data['id']) != run_id or str(data['run_attempt']) != attempt:
                  raise ValueError()
              started = datetime.fromisoformat(data['run_started_at'].replace('Z', '+00:00'))
              now = time.time()
              if started.tzinfo is None or started.timestamp() > now:
                  raise ValueError()
              # Leave two minutes before the runner's 360-minute job timeout.
              deadline = int(started.timestamp()) + 360 * 60 - 120
              if deadline - now < 9000:
                  raise ValueError()
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH=' + str(deadline) + '\n')
          except Exception:
              # Never echo the request, token, response or environment.
              raise SystemExit('Unable to establish sufficient deployment job time; retry in a fresh job') from None
          PYBUDGET

      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # JDK 21 설치
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Gradle wrapper 실행 권한 부여
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 테스트를 제외하고 실행 가능한 Spring Boot JAR 생성
      - name: Build
        run: ./gradlew :api:bootJar -x test --no-daemon

      # 테스트 실행
      - name: Test
        env:
          IEUM_TEST_REDIS_HOST: 127.0.0.1
          IEUM_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          IEUM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ieum_ci_test
          IEUM_TEST_POSTGRES_USER: ieum_ci_test
          IEUM_TEST_POSTGRES_PASSWORD: ieum_ci_test_only_password
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/bluegreen -p 'test_*.py'
          ./gradlew test --no-daemon

      # Docker 이미지에 넣을 Spring Boot JAR 준비
      - name: Prepare boot jar
        run: |
          mkdir -p .deploy

          BOOT_JAR="$(find api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | head -n 1)"

          if [ -z "$BOOT_JAR" ]; then
            echo "::error::Spring Boot jar file was not found in api/build/libs"
            exit 1
          fi

          cp "$BOOT_JAR" .deploy/app.jar

      # CI 배포용 Dockerfile 생성
      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM eclipse-temurin:21-jre
          LABEL ieum.bluegreen.capable="true"
          LABEL ieum.bluegreen.protocol="2"
          WORKDIR /app
          COPY .deploy/app.jar /app/app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          EOF

      # Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Verify installed blue-green release
        env:
          CONTROLLER_SHA: ${{ vars.BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure the approved BLUEGREEN_CONTROLLER_SHA256 and BLUEGREEN_HELPER_SHA256 variables first"
            exit 1
          fi
          if ! printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::Installed blue-green controller/helper does not match the approved release"
            exit 1
          fi

      - name: Deploy with prefixed GitHub Secrets
        env:
          IMAGE_TAG: ${{ github.sha }}
          IEUM_BACKEND_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          candidate_env="$(mktemp "$RUNNER_TEMP/ieum-backend-env.XXXXXX")"
          trap 'rm -f -- "$candidate_env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 scripts/bluegreen/backend_env.py "$candidate_env"
          # Do not pass the full workflow Secrets context to the controller.
          unset IEUM_BACKEND_SECRETS_JSON
          python3 /home/kwung/deploy/bluegreen/bluegreen.py --lock-timeout 14400 deploy \
            --job-deadline-epoch "$IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH" \
            --service backend \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --env-file "$candidate_env" \
            --replace-env

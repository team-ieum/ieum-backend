name: Backend Dev Server Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend_dev_server
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ieum-backend-dev
  CONTAINER_NAME: ieum-backend
  LEGACY_CONTAINER_NAME: hirescope-backend
  DOCKER_NETWORK: ieum_net_green
  BACKEND_IP: 10.10.10.11
  BACKEND_PORT: '8080'
  SPRING_PROFILES_ACTIVE: dev
  ENV_FILE: /home/kwung/deploy/ieum-backend/.env

jobs:
  deploy:
    name: Deploy Dev to Self Hosted Server
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-backend]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 설치
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Gradle wrapper 실행 권한 부여
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 테스트를 제외하고 실행 가능한 Spring Boot JAR 생성
      - name: Build
        run: ./gradlew :api:bootJar -x test --no-daemon

      # 테스트 실행
      - name: Test
        run: ./gradlew test --no-daemon

      # Docker 이미지에 넣을 Spring Boot JAR 준비
      - name: Prepare boot jar
        run: |
          mkdir -p .deploy

          BOOT_JAR="$(find api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | head -n 1)"

          if [ -z "$BOOT_JAR" ]; then
            echo "::error::Spring Boot jar file was not found in api/build/libs"
            exit 1
          fi

          cp "$BOOT_JAR" .deploy/app.jar

      # CI 배포용 Dockerfile 생성
      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM eclipse-temurin:21-jre
          WORKDIR /app
          COPY .deploy/app.jar /app/app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          EOF

      # Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      # 기존 백엔드 컨테이너 교체
      - name: Restart backend container
        run: |
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || docker network create --subnet 10.10.10.0/24 "$DOCKER_NETWORK"

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker rm -f "$LEGACY_CONTAINER_NAME" >/dev/null 2>&1 || true

          ENV_ARGS=""
          if [ -f "$ENV_FILE" ]; then
            ENV_ARGS="--env-file $ENV_FILE"
          fi

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network "$DOCKER_NETWORK" \
            --ip "$BACKEND_IP" \
            -e SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
            $ENV_ARGS \
            "$IMAGE_NAME:latest"

      # 배포 확인
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://$BACKEND_IP:$BACKEND_PORT/actuator/health" >/dev/null 2>&1; then
              exit 0
            fi

            if curl -fsS "http://$BACKEND_IP:$BACKEND_PORT/v3/api-docs" >/dev/null 2>&1; then
              exit 0
            fi

            sleep 2
          done

          docker logs --tail 200 "$CONTAINER_NAME"
          exit 1

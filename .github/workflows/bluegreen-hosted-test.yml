name: Blue Green Hosted Test (Temporary)

on:
  push:
    branches: ['infra/IEUM-BE-102']

permissions:
  contents: read

concurrency:
  group: bluegreen-hosted-test-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ieum-backend-hosted-test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ieum_ci_test
          POSTGRES_DB: ieum_ci_test
          # Disposable CI database only; this is not an application credential.
          POSTGRES_PASSWORD: ieum_ci_test_only_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ieum_ci_test -d ieum_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :api:bootJar -x test --no-daemon

      - name: Test
        env:
          IEUM_TEST_REDIS_HOST: 127.0.0.1
          IEUM_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          IEUM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ieum_ci_test
          IEUM_TEST_POSTGRES_USER: ieum_ci_test
          IEUM_TEST_POSTGRES_PASSWORD: ieum_ci_test_only_password
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/bluegreen -p 'test_*.py'
          ./gradlew test --no-daemon

      - name: Prepare boot jar
        run: |
          mkdir -p .deploy

          BOOT_JAR="$(find api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | head -n 1)"

          if [ -z "$BOOT_JAR" ]; then
            echo "::error::Spring Boot jar file was not found in api/build/libs"
            exit 1
          fi

          cp "$BOOT_JAR" .deploy/app.jar

      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM eclipse-temurin:21-jre
          LABEL ieum.bluegreen.capable="true"
          LABEL ieum.bluegreen.protocol="2"
          WORKDIR /app
          COPY .deploy/app.jar /app/app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          EOF

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .
